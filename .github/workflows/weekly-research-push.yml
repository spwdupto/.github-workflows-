name: Weekly Research Digest Push

on:
  schedule:
    # 每周一 UTC 1:00 (北京时间 9:00)
    # 格式顺序：分 时 日 月 周
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 保留手动触发，方便你随时测试

jobs:
  push-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dify Workflow
        env:
          DIFY_API_URL: ${{ secrets.DIFY_API_URL }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          echo "🚀 Starting weekly request to Dify..."

          # --- 1. 生成时间变量 ---
          CURRENT_TIME_UTC=$(date -u "+%Y-%m-%d %H:%M:%S")
          echo "Generated Target Time (UTC): $CURRENT_TIME_UTC"

          # --- 2. 发送请求 (改为 streaming 模式并增加超时容忍) ---
          response=$(curl -s -w "\n%{http_code}" -X POST "$DIFY_API_URL" \
            -H "Authorization: Bearer $DIFY_API_KEY" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            -d '{
                  "inputs": {
                      "target_time": "'"$CURRENT_TIME_UTC"'"
                  }, 
                  "response_mode": "streaming",
                  "user": "github-action-bot"
                }')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "----------------------------------------"
          echo "HTTP Status: $http_code"
          echo "Response Body: $body"
          echo "----------------------------------------"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Weekly push completed successfully"
          else
            echo "❌ Push failed with status $http_code"
            exit 1
          fi
